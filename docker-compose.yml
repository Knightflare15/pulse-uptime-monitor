services:
  backend:
    build: ./backend
    environment:
      CHECK_INTERVAL_SECONDS: 60
      REQUEST_TIMEOUT_SECONDS: 10
      CHECK_CONCURRENCY: 20
    volumes:
      - uptime-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  uptime-data:
